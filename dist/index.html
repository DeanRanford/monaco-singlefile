<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monaco + Sandbox Runner</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #14161a;
      color: #e6e8ec;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #1d2026;
      border-bottom: 1px solid #2c313a;
    }

    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #3d63dd;
      border-radius: 6px;
      background: #3d63dd;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #4e73e8;
    }

    button.secondary {
      background: #282c35;
      border-color: #3a404c;
      color: #d0d4dc;
    }

    button.secondary:hover {
      background: #323742;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 360px;
      flex: 1;
      min-height: 0;
    }

    /* Mount target for MonacoController */
    #monaco-editor,
    #editor-container {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .output-panel {
      display: flex;
      flex-direction: column;
      border-left: 1px solid #2c313a;
      background: #181a20;
      min-height: 0;
    }

    .output-header {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9aa2b1;
      border-bottom: 1px solid #2c313a;
    }

    #console-output {
      flex: 1;
      margin: 0;
      padding: 12px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-text {
      color: #ff6b6b;
    }

    @media (max-width: 800px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 220px;
      }

      .output-panel {
        border-left: none;
        border-top: 1px solid #2c313a;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Standalone Script Editor</h1>
    <div class="controls">
      <button id="run-btn" type="button">Run Script</button>
      <button id="clear-btn" class="secondary" type="button">Clear Output</button>
    </div>
  </header>

  <main class="workspace">
    <!-- If MonacoController expects a specific container ID, pass it or match its selector -->
    <div id="monaco-editor"></div>

    <aside class="output-panel">
      <div class="output-header">Console Output</div>
      <pre id="console-output"></pre>
    </aside>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>
