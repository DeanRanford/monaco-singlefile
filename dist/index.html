<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Monaco + JS-Interpreter</title>
  <link rel="stylesheet" href="./monaco.css" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      background: #14161a;
      color: #e6e8ec;
    }

    bar {
      display: flex;
      padding: 8px 12px;
      background: #1d2026;
      border-bottom: 1px solid #2c313a;
    }

    button {
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      border: 0;
      border-radius: 5px;
      background: #3d63dd;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #4e73e8;
    }

    #editor {
      flex: 1;
      min-height: 0;
    }

    #output {
      height: 150px;
      margin: 0;
      padding: 10px 12px;
      overflow: auto;
      background: #181a20;
      border-top: 1px solid #2c313a;
      font-family: ui-monospace, monospace;
      font-size: 12.5px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <bar>
    <button id="run-btn" type="button">Run</button>
  </bar>

  <div id="editor"></div>
  <pre id="output"></pre>

  <script type="module">
    import * as MonacoBundle from "./monaco.js";
    import * as InterpreterModule from "./acorn_interpreter.js";

    const Interpreter =
      InterpreterModule.Interpreter ??
      InterpreterModule.default?.Interpreter ??
      globalThis.Interpreter;

    const bundle = MonacoBundle.default ?? MonacoBundle;
    const editor = bundle.createEditor(document.getElementById("editor"), {
      value: [
        "// ES5-style JS runs in the sandbox",
        "function add(a, b) {",
        "  return a + b;",
        "}",
        'print("2 + 3 =", add(2, 3));',
        'var a = game.log("hello from game");',
        'print(a);',
        "add(10, 20);",
      ].join("\n"),
      language: "javascript",
      theme: "vs-dark",
      automaticLayout: true,
    });

    const outputEl = document.getElementById("output");
    const MAX_STEPS = 50000;

    function runCode() {
      const logs = [];

      try {
        const interpreter = new Interpreter(editor.getValue(), (interp, global) => {
          interp.setProperty(
            global,
            "print",
            interp.createNativeFunction((...args) => {
              logs.push(args.join(" "));
            })
          );

          const game = interp.nativeToPseudo({});
          interp.setProperty(global, "game", game);
          interp.setProperty(
            game,
            "log",
            interp.createNativeFunction((msg) => {
              logs.push(`[game] ${msg}`);
              return 42;
            })
          );
        });

        let steps = 0;
        while (interpreter.step()) {
          if (++steps >= MAX_STEPS) {
            throw new Error(`Stopped after ${MAX_STEPS} steps (possible infinite loop).`);
          }
        }

        const lines = [...logs];
        if (interpreter.value !== undefined) {
          lines.push(`=> ${interpreter.value}`);
        }
        outputEl.textContent = lines.join("\n");
      } catch (err) {
        outputEl.textContent = `Error: ${err.message ?? err}`;
      }
    }

    document.getElementById("run-btn").addEventListener("click", runCode);
  </script>
</body>
</html>
